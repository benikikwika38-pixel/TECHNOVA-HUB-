<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administration - Communiqués</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#050816;
    color:white;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:850px;
    margin:40px auto;
}

.back{
    display:inline-block;
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,.08);
    padding:10px 18px;
    border-radius:12px;
    margin-bottom:25px;
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.header h1{
    font-size:35px;
}

.header p{
    color:#94a3b8;
    margin-top:8px;
}

.panel{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.10);
    padding:30px;
    border-radius:22px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

input,
textarea{
    width:100%;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.10);
    color:white;
    padding:15px;
    border-radius:12px;
    outline:none;
    margin-bottom:20px;
}

input:focus,
textarea:focus{
    border-color:#60a5fa;
}

textarea{
    min-height:180px;
    resize:vertical;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#2563eb,#7c3aed);
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    margin-top:20px;
    padding:15px;
    border-radius:12px;
    display:none;
}

.success{
    display:block;
    background:rgba(34,197,94,.12);
    color:#4ade80;
}

.error{
    display:block;
    background:rgba(239,68,68,.12);
    color:#f87171;
}

.list{
    margin-top:30px;
}

.list h2{
    margin-bottom:20px;
}

.item{
    background:rgba(255,255,255,.05);
    padding:20px;
    border-radius:15px;
    margin-bottom:15px;
}

.item h3{
    margin-bottom:8px;
}

.item p{
    color:#cbd5e1;
    white-space:pre-wrap;
    line-height:1.6;
}

.delete{
    width:auto;
    background:#dc2626;
    padding:9px 15px;
    margin-top:15px;
}

@media(max-width:600px){

    .container{
        margin:20px auto;
    }

    .panel{
        padding:20px;
    }

    .header h1{
        font-size:28px;
    }

}

</style>

</head>

<body>

<div class="container">

<a href="dashboard.html" class="back">
⬅ Retour Dashboard
</a>

<div class="header">

<h1>📢 Gestion des communiqués</h1>

<p>
Espace réservé à l'administration de TechNova Hub.
</p>

</div>


<div class="panel">

<form id="formCommunique">

<label for="titre">
Titre du communiqué
</label>

<input
type="text"
id="titre"
placeholder="Ex : Examen de rattrapage"
required
>


<label for="contenu">
Contenu du communiqué
</label>

<textarea
id="contenu"
placeholder="Écrivez votre communiqué ici..."
required
></textarea>


<button type="submit" id="publishBtn">

📢 Publier le communiqué

</button>

</form>


<div id="message" class="message"></div>

</div>


<div class="list">

<h2>📋 Communiqués publiés</h2>

<div id="liste">

Chargement...

</div>

</div>

</div>

 
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* ================================
   🔥 CONFIGURATION FIREBASE
================================ */

const firebaseConfig = {

    apiKey: "AIzaSyADpfbXDg9Sr9sa-y9ImIydodzvQqUOpDU",

    authDomain: "technova-hub-a6133.firebaseapp.com",

    projectId: "technova-hub-a6133",

    storageBucket: "technova-hub-a6133.firebasestorage.app",

    messagingSenderId: "858060696573",

    appId: "1:858060696573:web:8f62c54a7e798bce230794"

};


/* ================================
   🚀 INITIALISATION
================================ */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* ================================
   🔐 UID ADMINISTRATEUR
================================ */

const ADMIN_UID = "z7RI30KNzTx4yH2";


/* ================================
   📌 ÉLÉMENTS HTML
================================ */

const form = document.getElementById("formCommunique");

const titre = document.getElementById("titre");

const contenu = document.getElementById("contenu");

const message = document.getElementById("message");

const button = document.getElementById("publishBtn");

const liste = document.getElementById("liste");


let utilisateurConnecte = null;


/* ================================
   🔐 VÉRIFICATION UTILISATEUR
================================ */

onAuthStateChanged(auth, (user) => {

    if (!user) {

        window.location.href = "login.html";

        return;

    }


    utilisateurConnecte = user;


    /* Vérification administrateur */

    if (user.uid !== ADMIN_UID) {

        alert(
            "⛔ Accès refusé.\n\n" +
            "Cette page est réservée à l'administrateur."
        );

        window.location.href = "dashboard.html";

        return;

    }


    /* Si c'est bien l'admin */

    chargerCommuniques();

});


/* ================================
   📢 PUBLICATION
================================ */

form.addEventListener("submit", async (e) => {

    e.preventDefault();


    if (!utilisateurConnecte) {

        afficherMessage(
            "❌ Vous devez être connecté.",
            "error"
        );

        return;

    }


    /* Double sécurité */

    if (utilisateurConnecte.uid !== ADMIN_UID) {

        afficherMessage(
            "⛔ Vous n'êtes pas autorisé à publier.",
            "error"
        );

        return;

    }


    const titreValue = titre.value.trim();

    const contenuValue = contenu.value.trim();


    if (!titreValue || !contenuValue) {

        afficherMessage(
            "⚠️ Veuillez remplir tous les champs.",
            "error"
        );

        return;

    }


    button.disabled = true;

    button.textContent = "⏳ Publication...";


    try {

        await addDoc(
            collection(db, "communiques"),
            {

                titre: titreValue,

                contenu: contenuValue,

                auteur: utilisateurConnecte.uid,

                createdAt: serverTimestamp()

            }
        );


        form.reset();


        afficherMessage(
            "✅ Communiqué publié avec succès !",
            "success"
        );


    } catch (error) {

        console.error(
            "Erreur Firestore :",
            error
        );


        afficherMessage(
            "❌ Erreur lors de la publication : " +
            error.message,
            "error"
        );

    } finally {

        button.disabled = false;

        button.textContent =
            "📢 Publier le communiqué";

    }

});


/* ================================
   📋 CHARGER LES COMMUNIQUÉS
================================ */

function chargerCommuniques() {

    const q = query(
        collection(db, "communiques"),
        orderBy("createdAt", "desc")
    );


    onSnapshot(
        q,
        (snapshot) => {

            liste.innerHTML = "";


            if (snapshot.empty) {

                liste.innerHTML =
                    "<p>Aucun communiqué publié.</p>";

                return;

            }


            snapshot.forEach(
                (documentSnapshot) => {

                    const data =
                        documentSnapshot.data();


                    const item =
                        document.createElement("div");

                    item.className = "item";


                    let date = "";


                    if (data.createdAt) {

                        date =
                            data.createdAt
                                .toDate()
                                .toLocaleString("fr-FR");

                    }


                    item.innerHTML = `

                        <h3>
                            📢 ${escapeHTML(
                                data.titre || ""
                            )}
                        </h3>

                        <p>
                            ${escapeHTML(
                                data.contenu || ""
                            )}
                        </p>

                        <small>
                            ${date}
                        </small>

                        <br>

                        <button
                            class="delete"
                            data-id="${documentSnapshot.id}"
                        >
                            🗑️ Supprimer
                        </button>

                    `;


                    item
                        .querySelector(".delete")
                        .addEventListener(
                            "click",
                            () => {

                                supprimerCommunique(
                                    documentSnapshot.id
                                );

                            }
                        );


                    liste.appendChild(item);

                }
            );

        },

        (error) => {

            console.error(
                "Erreur de lecture Firestore :",
                error
            );


            liste.innerHTML =
                "<p>❌ Impossible de charger les communiqués.</p>";

        }
    );

}


/* ================================
   🗑️ SUPPRIMER
================================ */

async function supprimerCommunique(id) {

    if (!utilisateurConnecte) {

        return;

    }


    if (utilisateurConnecte.uid !== ADMIN_UID) {

        afficherMessage(
            "⛔ Vous n'êtes pas autorisé à supprimer.",
            "error"
        );

        return;

    }


    const confirmation = confirm(
        "Voulez-vous vraiment supprimer ce communiqué ?"
    );


    if (!confirmation) {

        return;

    }


    try {

        await deleteDoc(
            doc(db, "communiques", id)
        );


        afficherMessage(
            "✅ Communiqué supprimé.",
            "success"
        );


    } catch (error) {

        console.error(error);


        afficherMessage(
            "❌ Impossible de supprimer le communiqué.",
            "error"
        );

    }

}


/* ================================
   💬 MESSAGE
================================ */

function afficherMessage(texte, type) {

    message.textContent = texte;

    message.className =
        "message " + type;

}


/* ================================
   🛡️ PROTECTION HTML
================================ */

function escapeHTML(texte) {

    const div =
        document.createElement("div");

    div.textContent = texte;

    return div.innerHTML;

}

</script>
