<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Communiqués - TechNova Hub</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:
        radial-gradient(circle at top left, rgba(37,99,235,.15), transparent 35%),
        radial-gradient(circle at bottom right, rgba(124,58,237,.15), transparent 35%),
        #050816;
    color:white;
    min-height:100vh;
    padding:20px;
}

/* =========================
   CONTAINER
========================= */

.container{
    max-width:850px;
    margin:0 auto;
}

/* =========================
   HEADER
========================= */

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:30px;
}

.logo{
    font-size:20px;
    font-weight:800;
}

.back{
    display:inline-flex;
    align-items:center;
    gap:7px;
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.08);
    padding:10px 16px;
    border-radius:12px;
    transition:.3s;
}

.back:hover{
    background:rgba(255,255,255,.14);
    transform:translateY(-2px);
}

/* =========================
   TITLE
========================= */

.header{
    text-align:center;
    margin-bottom:30px;
}

.header .icon{
    font-size:50px;
    margin-bottom:10px;
}

.header h1{
    font-size:34px;
    font-weight:800;
}

.header p{
    color:#94a3b8;
    margin-top:8px;
}

/* =========================
   STATUS
========================= */

.status{
    padding:14px 18px;
    border-radius:14px;
    margin-bottom:25px;
    font-size:14px;
    display:none;
}

.status.loading{
    display:block;
    background:rgba(59,130,246,.12);
    color:#60a5fa;
}

.status.error{
    display:block;
    background:rgba(239,68,68,.12);
    color:#f87171;
}

.status.success{
    display:block;
    background:rgba(34,197,94,.12);
    color:#4ade80;
}

/* =========================
   COMMUNIQUÉS
========================= */

#liste{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.empty{
    text-align:center;
    padding:50px 20px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
}

.empty .emoji{
    font-size:45px;
    margin-bottom:15px;
}

.empty h2{
    font-size:20px;
    margin-bottom:8px;
}

.empty p{
    color:#94a3b8;
}

/* =========================
   CARD
========================= */

.communique{
    position:relative;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.10);
    border-radius:22px;
    padding:24px;
    overflow:hidden;
    transition:.3s;
}

.communique:hover{
    transform:translateY(-3px);
    border-color:rgba(96,165,250,.35);
    background:rgba(255,255,255,.08);
}

.communique::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:4px;
    background:linear-gradient(
        180deg,
        #2563eb,
        #7c3aed
    );
}

.badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(37,99,235,.15);
    color:#60a5fa;
    padding:6px 10px;
    border-radius:50px;
    font-size:12px;
    font-weight:600;
    margin-bottom:12px;
}

.communique h2{
    font-size:22px;
    margin-bottom:10px;
    line-height:1.35;
}

.communique-content{
    color:#cbd5e1;
    line-height:1.8;
    font-size:15px;
    white-space:pre-wrap;
    word-wrap:break-word;
}

.date{
    display:block;
    margin-top:18px;
    padding-top:14px;
    border-top:1px solid rgba(255,255,255,.08);
    color:#64748b;
    font-size:12px;
}

/* =========================
   NEW INDICATOR
========================= */

.new{
    position:absolute;
    top:18px;
    right:18px;
    background:#ef4444;
    color:white;
    font-size:10px;
    font-weight:700;
    padding:5px 9px;
    border-radius:50px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body{
        padding:15px;
    }

    .topbar{
        align-items:flex-start;
    }

    .logo{
        font-size:17px;
    }

    .header h1{
        font-size:27px;
    }

    .header .icon{
        font-size:42px;
    }

    .communique{
        padding:20px;
    }

    .communique h2{
        font-size:19px;
    }

}

</style></head><body><div class="container"><!-- TOPBAR -->

<div class="topbar">

    <div class="logo">
        🚀 TechNova Hub
    </div>

    <a href="dashboard.html" class="back">
        ⬅ Retour
    </a>

</div>


<!-- TITRE -->

<div class="header">

    <div class="icon">
        📢
    </div>

    <h1>
        Communiqués
    </h1>

    <p>
        Restez informé des dernières annonces de TechNova Hub.
    </p>

</div>


<!-- STATUT -->

<div id="status" class="status loading">
    ⏳ Chargement des communiqués...
</div>


<!-- LISTE -->

<div id="liste"></div>

</div><script type="module">

/* ================================
   🔥 FIREBASE
================================ */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    query,
    orderBy,
    onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* ================================
   🔥 CONFIGURATION
================================ */

const firebaseConfig = {

    apiKey: "AIzaSyADpfbXDg9Sr9sa-y9ImIydodzvQqUOpDU",

    authDomain: "technova-hub-a6133.firebaseapp.com",

    projectId: "technova-hub-a6133",

    storageBucket: "technova-hub-a6133.firebasestorage.app",

    messagingSenderId: "858060696573",

    appId: "1:858060696573:web:8f62c54a7e798bce230794"

};


/* ================================
   🚀 INITIALISATION
================================ */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* ================================
   📌 ÉLÉMENTS
================================ */

const liste = document.getElementById("liste");

const status = document.getElementById("status");


/* ================================
   🔐 AUTHENTIFICATION
================================ */

onAuthStateChanged(auth, (user) => {

    if(!user){

        window.location.href = "login.html";

        return;

    }

    chargerCommuniques();

});


/* ================================
   📢 CHARGEMENT TEMPS RÉEL
================================ */

function chargerCommuniques(){

    const communiquesQuery = query(
        collection(db, "communiques"),
        orderBy("createdAt", "desc")
    );


    onSnapshot(

        communiquesQuery,

        (snapshot) => {

            liste.innerHTML = "";


            /* Connexion Firestore réussie */

            status.className = "status success";

            status.textContent =
                "🟢 Communiqués mis à jour en temps réel.";

            setTimeout(() => {

                status.style.display = "none";

            }, 2000);


            /* Aucun communiqué */

            if(snapshot.empty){

                liste.innerHTML = `

                    <div class="empty">

                        <div class="emoji">
                            📭
                        </div>

                        <h2>
                            Aucun communiqué
                        </h2>

                        <p>
                            Aucun communiqué n'a encore été publié.
                        </p>

                    </div>

                `;

                return;

            }


            /* Affichage */

            snapshot.forEach((docSnapshot) => {

                const data = docSnapshot.data();


                const card =
                    document.createElement("article");

                card.className = "communique";


                /* Titre */

                const title =
                    document.createElement("h2");

                title.textContent =
                    "📢 " + (data.titre || "Sans titre");


                /* Contenu */

                const content =
                    document.createElement("div");

                content.className =
                    "communique-content";

                content.textContent =
                    data.contenu || "";


                /* Badge */

                const badge =
                    document.createElement("div");

                badge.className = "badge";

                badge.textContent =
                    "📣 Annonce officielle";


                /* Nouveau */

                const newBadge =
                    document.createElement("span");

                newBadge.className = "new";

                newBadge.textContent =
                    "NOUVEAU";


                /* Date */

                const dateElement =
                    document.createElement("small");

                dateElement.className = "date";


                if(data.createdAt){

                    try{

                        const date =
                            data.createdAt.toDate();

                        dateElement.textContent =
                            "📅 Publié le " +
                            date.toLocaleDateString(
                                "fr-FR",
                                {
                                    day:"2-digit",
                                    month:"long",
                                    year:"numeric"
                                }
                            ) +
                            " à " +
                            date.toLocaleTimeString(
                                "fr-FR",
                                {
                                    hour:"2-digit",
                                    minute:"2-digit"
                                }
                            );

                    }catch(error){

                        dateElement.textContent =
                            "📅 Publication en cours...";

                    }

                }else{

                    dateElement.textContent =
                        "📅 Publication en cours...";

                }


                /* Construction */

                card.appendChild(badge);

                card.appendChild(title);

                card.appendChild(content);

                card.appendChild(dateElement);

                card.appendChild(newBadge);


                liste.appendChild(card);

            });

        },


        (error) => {

            console.error(
                "Erreur Firestore :",
                error
            );


            status.className =
                "status error";

            status.style.display =
                "block";

            status.textContent =
                "❌ Impossible de charger les communiqués.";


            liste.innerHTML = `

                <div class="empty">

                    <div class="emoji">
                        ⚠️
                    </div>

                    <h2>
                        Erreur de chargement
                    </h2>

                    <p>
                        Vérifiez votre connexion Internet
                        ou les règles de sécurité Firebase.
                    </p>

                </div>

            `;

        }

    );

}

</script>
</body>
</html>
