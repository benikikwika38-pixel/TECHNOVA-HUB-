<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Communiqués - TechNova Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at top left,rgba(37,99,235,.15),transparent 35%),
        radial-gradient(circle at bottom right,rgba(124,58,237,.15),transparent 35%),
        #050816;
    color:white;
    padding:20px;
}

.container{
    max-width:850px;
    margin:auto;
}

/* =========================
   HEADER
========================= */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:30px;
}

.logo{
    font-size:20px;
    font-weight:800;
}

.back{
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.1);
    padding:10px 16px;
    border-radius:12px;
    transition:.3s;
}

.back:hover{
    background:rgba(255,255,255,.15);
}

/* =========================
   TITRE
========================= */

.header{
    text-align:center;
    margin-bottom:30px;
}

.header-icon{
    font-size:50px;
    margin-bottom:8px;
}

.header h1{
    font-size:34px;
    font-weight:800;
}

.header p{
    color:#94a3b8;
    margin-top:8px;
}

/* =========================
   INFO UTILISATEUR
========================= */

.user-info{
    display:none;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    padding:12px 16px;
    border-radius:14px;
    margin-bottom:20px;
    color:#cbd5e1;
    font-size:13px;
}

.admin-label{
    color:#4ade80;
    font-weight:700;
}

/* =========================
   PANNEAU ADMIN
========================= */

.admin-panel{
    display:none;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(96,165,250,.2);
    padding:25px;
    border-radius:22px;
    margin-bottom:30px;
}

.admin-title{
    font-size:21px;
    font-weight:700;
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

input,
textarea{
    width:100%;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.1);
    color:white;
    padding:14px;
    border-radius:12px;
    outline:none;
    margin-bottom:18px;
    font-size:14px;
}

input:focus,
textarea:focus{
    border-color:#60a5fa;
}

textarea{
    min-height:150px;
    resize:vertical;
}

.publish-btn{
    width:100%;
    border:0;
    padding:15px;
    border-radius:12px;
    background:linear-gradient(90deg,#2563eb,#7c3aed);
    color:white;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.publish-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* =========================
   MESSAGE
========================= */

.message{
    display:none;
    padding:13px 15px;
    margin-top:15px;
    border-radius:12px;
    font-size:13px;
}

.success{
    display:block;
    background:rgba(34,197,94,.12);
    color:#4ade80;
}

.error{
    display:block;
    background:rgba(239,68,68,.12);
    color:#f87171;
}

/* =========================
   LISTE
========================= */

.section-title{
    font-size:22px;
    margin-bottom:20px;
}

#liste{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.empty{
    text-align:center;
    padding:50px 20px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
}

.empty-icon{
    font-size:45px;
    margin-bottom:12px;
}

.empty p{
    color:#94a3b8;
    margin-top:7px;
}

/* =========================
   COMMUNIQUE
========================= */

.communique{
    position:relative;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;
    padding:22px;
    overflow:hidden;
}

.communique::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:4px;
    background:linear-gradient(
        180deg,
        #2563eb,
        #7c3aed
    );
}

.badge{
    display:inline-block;
    background:rgba(37,99,235,.15);
    color:#60a5fa;
    padding:5px 10px;
    border-radius:50px;
    font-size:11px;
    font-weight:700;
    margin-bottom:12px;
}

.communique h2{
    font-size:20px;
    margin-bottom:10px;
    padding-right:60px;
}

.communique-content{
    color:#cbd5e1;
    line-height:1.8;
    white-space:pre-wrap;
    word-break:break-word;
}

.date{
    display:block;
    margin-top:16px;
    padding-top:12px;
    border-top:1px solid rgba(255,255,255,.08);
    color:#64748b;
    font-size:11px;
}

/* =========================
   NOUVEAU
========================= */

.new-badge{
    position:absolute;
    top:18px;
    right:18px;
    background:#ef4444;
    color:white;
    padding:5px 8px;
    border-radius:50px;
    font-size:9px;
    font-weight:800;
}

/* =========================
   SUPPRESSION
========================= */

.delete-btn{
    margin-top:15px;
    border:0;
    background:#dc2626;
    color:white;
    padding:9px 13px;
    border-radius:9px;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
}

.delete-btn:hover{
    background:#b91c1c;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body{
        padding:15px;
    }

    .logo{
        font-size:17px;
    }

    .header h1{
        font-size:28px;
    }

    .header-icon{
        font-size:42px;
    }

    .admin-panel{
        padding:20px;
    }

    .communique{
        padding:19px;
    }

}

</style>

</head>


<body>

<div class="container">


    <!-- =========================
         BARRE DU HAUT
    ========================== -->

    <div class="topbar">

        <div class="logo">
            🚀 TechNova Hub
        </div>

        <a href="dashboard.html" class="back">
            ⬅ Retour
        </a>

    </div>


    <!-- =========================
         TITRE
    ========================== -->

    <div class="header">

        <div class="header-icon">
            📢
        </div>

        <h1>
            Communiqués
        </h1>

        <p>
            Les annonces officielles de TechNova Hub
        </p>

    </div>


    <!-- =========================
         INFO UTILISATEUR
    ========================== -->

    <div id="userInfo" class="user-info"></div>


    <!-- =========================
         PANNEAU ADMIN
    ========================== -->

    <div id="adminPanel" class="admin-panel">

        <div class="admin-title">
            👑 Publier un communiqué
        </div>

        <form id="formCommunique">

            <label for="titre">
                Titre
            </label>

            <input
                type="text"
                id="titre"
                placeholder="Ex : Examen de rattrapage"
                maxlength="150"
                required
            >


            <label for="contenu">
                Message
            </label>

            <textarea
                id="contenu"
                placeholder="Écrivez votre communiqué ici..."
                maxlength="5000"
                required
            ></textarea>


            <button
                type="submit"
                class="publish-btn"
                id="publishBtn"
            >
                📢 Publier le communiqué
            </button>

        </form>


        <div
            id="message"
            class="message"
        ></div>

    </div>


    <!-- =========================
         LISTE DES COMMUNIQUÉS
    ========================== -->

    <h2 class="section-title">
        📋 Derniers communiqués
    </h2>

    <div id="liste">

        <div class="empty">

            <div class="empty-icon">
                ⏳
            </div>

            <p>
                Chargement des communiqués...
            </p>

        </div>

    </div>


</div>


<script type="module">

/* =====================================================
   🔥 IMPORTS FIREBASE
===================================================== */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    doc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* =====================================================
   🔥 CONFIGURATION FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyADpfbXDg9Sr9sa-y9ImIydodzvQqUOpDU",

    authDomain:
        "technova-hub-a6133.firebaseapp.com",

    projectId:
        "technova-hub-a6133",

    storageBucket:
        "technova-hub-a6133.firebasestorage.app",

    messagingSenderId:
        "858060696573",

    appId:
        "1:858060696573:web:8f62c54a7e798bce230794"

};


/* =====================================================
   🚀 INITIALISATION
===================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =====================================================
   👑 ADMIN
===================================================== */

const ADMIN_UID =
    "cOeNwdUQYVNRjz7RI30KNzTx4yH2";


/* =====================================================
   📌 ELEMENTS HTML
===================================================== */

const adminPanel =
    document.getElementById("adminPanel");

const userInfo =
    document.getElementById("userInfo");

const form =
    document.getElementById("formCommunique");

const titre =
    document.getElementById("titre");

const contenu =
    document.getElementById("contenu");

const publishBtn =
    document.getElementById("publishBtn");

const message =
    document.getElementById("message");

const liste =
    document.getElementById("liste");


/* =====================================================
   👤 UTILISATEUR CONNECTÉ
===================================================== */

let utilisateurConnecte = null;


/* =====================================================
   🔐 AUTHENTIFICATION
===================================================== */

onAuthStateChanged(auth, (user) => {

    if(!user){

        window.location.href =
            "login.html";

        return;

    }


    utilisateurConnecte = user;


    /* =================================================
       👑 SI ADMIN
    ================================================= */

    if(user.uid === ADMIN_UID){

        adminPanel.style.display =
            "block";

        userInfo.style.display =
            "block";

        userInfo.innerHTML =
            "👑 Connecté en tant que " +
            "<span class='admin-label'>" +
            "Administrateur" +
            "</span>";

    }


    /* =================================================
       👨‍🎓 SI ÉTUDIANT
    ================================================= */

    else{

        adminPanel.style.display =
            "none";

        userInfo.style.display =
            "block";

        userInfo.textContent =
            "👨‍🎓 Connecté à TechNova Hub";

    }


    chargerCommuniques();

});


/* =====================================================
   📢 PUBLIER UN COMMUNIQUÉ
===================================================== */

form.addEventListener("submit", async (e) => {

    e.preventDefault();


    if(!utilisateurConnecte){

        afficherMessage(
            "❌ Vous devez être connecté.",
            "error"
        );

        return;

    }


    /* Vérification ADMIN */

    if(
        utilisateurConnecte.uid !==
        ADMIN_UID
    ){

        afficherMessage(
            "⛔ Vous n'êtes pas autorisé à publier.",
            "error"
        );

        return;

    }


    const titreValue =
        titre.value.trim();

    const contenuValue =
        contenu.value.trim();


    if(!titreValue || !contenuValue){

        afficherMessage(
            "⚠️ Veuillez remplir tous les champs.",
            "error"
        );

        return;

    }


    publishBtn.disabled =
        true;

    publishBtn.textContent =
        "⏳ Publication...";


    try{

        await addDoc(
            collection(
                db,
                "communiques"
            ),
            {

                titre:
                    titreValue,

                contenu:
                    contenuValue,

                auteur:
                    utilisateurConnecte.uid,

                createdAt:
                    serverTimestamp()

            }
        );


        form.reset();


        afficherMessage(
            "✅ Communiqué publié avec succès !",
            "success"
        );


    }
    catch(error){

        console.error(
            "Erreur publication :",
            error
        );


        afficherMessage(
            "❌ Erreur : " +
            error.message,
            "error"
        );

    }


    publishBtn.disabled =
        false;

    publishBtn.textContent =
        "📢 Publier le communiqué";

});


/* =====================================================
   📋 CHARGER LES COMMUNIQUÉS
===================================================== */

function chargerCommuniques(){

    const q =
        query(
            collection(
                db,
                "communiques"
            ),
            orderBy(
                "createdAt",
                "desc"
            )
        );


    onSnapshot(

        q,

        (snapshot) => {

            liste.innerHTML = "";


            /* Aucun communiqué */

            if(snapshot.empty){

                liste.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            📭
                        </div>

                        <h3>
                            Aucun communiqué
                        </h3>

                        <p>
                            Aucun communiqué n'a encore été publié.
                        </p>

                    </div>

                `;

                return;

            }


            /* Affichage */

            snapshot.forEach(
                (docSnapshot) => {

                    const data =
                        docSnapshot.data();


                    const card =
                        document.createElement(
                            "article"
                        );

                    card.className =
                        "communique";


                    /* Badge */

                    const badge =
                        document.createElement(
                            "div"
                        );

                    badge.className =
                        "badge";

                    badge.textContent =
                        "📣 Annonce officielle";


                    /* Titre */

                    const title =
                        document.createElement(
                            "h2"
                        );

                    title.textContent =
                        "📢 " +
                        (
                            data.titre ||
                            "Sans titre"
                        );


                    /* Contenu */

                    const content =
                        document.createElement(
                            "div"
                        );

                    content.className =
                        "communique-content";

                    content.textContent =
                        data.contenu ||
                        "";


                    /* Date */

                    const date =
                        document.createElement(
                            "small"
                        );

                    date.className =
                        "date";


                    if(data.createdAt){

                        try{

                            const dateObject =
                                data.createdAt.toDate();


                            date.textContent =
                                "📅 Publié le " +
                                dateObject.toLocaleDateString(
                                    "fr-FR",
                                    {
                                        day:"2-digit",
                                        month:"long",
                                        year:"numeric"
                                    }
                                ) +
                                " à " +
                                dateObject.toLocaleTimeString(
                                    "fr-FR",
                                    {
                                        hour:"2-digit",
                                        minute:"2-digit"
                                    }
                                );

                        }
                        catch{

                            date.textContent =
                                "📅 Publication en cours...";

                        }

                    }
                    else{

                        date.textContent =
                            "📅 Publication en cours...";

                    }


                    /* Badge NOUVEAU */

                    const newBadge =
                        document.createElement(
                            "span"
                        );

                    newBadge.className =
                        "new-badge";

                    newBadge.textContent =
                        "NOUVEAU";


                    /* Construction */

                    card.appendChild(
                        badge
                    );

                    card.appendChild(
                        title
                    );

                    card.appendChild(
                        content
                    );

                    card.appendChild(
                        date
                    );


                    /* =================================================
                       👑 BOUTON SUPPRIMER UNIQUEMENT POUR ADMIN
                    ================================================= */

                                    if(
                        utilisateurConnecte &&
                        utilisateurConnecte.uid ===
                        ADMIN_UID
                    ){

                        const deleteButton =
                            document.createElement(
                                "button"
                            );

                        deleteButton.className =
                            "delete-btn";

                        deleteButton.textContent =
                            "🗑️ Supprimer";


                        deleteButton.addEventListener(
                            "click",
                            () => {

                                supprimerCommunique(
                                    docSnapshot.id
                                );

                            }
                        );


                        card.appendChild(
                            deleteButton
                        );

                    }


                    /* Badge NOUVEAU */

                    card.appendChild(
                        newBadge
                    );


                    /* Ajouter la carte */

                    liste.appendChild(
                        card
                    );

                }
            );

        },


        /* =================================================
           ❌ ERREUR DE LECTURE
        ================================================= */

        (error) => {

            console.error(
                "Erreur Firestore :",
                error
            );


            liste.innerHTML = `

                <div class="empty">

                    <div class="empty-icon">
                        ⚠️
                    </div>

                    <h3>
                        Impossible de charger
                    </h3>

                    <p>
                        Vérifiez votre connexion
                        ou les règles Firestore.
                    </p>

                </div>

            `;

        }

    );

}


/* =====================================================
   🗑️ SUPPRIMER UN COMMUNIQUÉ
===================================================== */

async function supprimerCommunique(id){

    /* Sécurité */

    if(
        !utilisateurConnecte ||
        utilisateurConnecte.uid !==
        ADMIN_UID
    ){

        afficherMessage(
            "⛔ Action non autorisée.",
            "error"
        );

        return;

    }


    /* Confirmation */

    const confirmation =
        confirm(
            "Voulez-vous vraiment supprimer ce communiqué ?"
        );


    if(!confirmation){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "communiques",
                id
            )
        );


        afficherMessage(
            "✅ Communiqué supprimé avec succès.",
            "success"
        );

    }
    catch(error){

        console.error(
            "Erreur suppression :",
            error
        );


        afficherMessage(
            "❌ Impossible de supprimer le communiqué.",
            "error"
        );

    }

}


/* =====================================================
   💬 AFFICHER UN MESSAGE
===================================================== */

function afficherMessage(
    texte,
    type
){

    message.textContent =
        texte;

    message.className =
        "message " + type;

}


/* =====================================================
   🔒 FIN DU SCRIPT
===================================================== */

</script>

</body>

</html>
