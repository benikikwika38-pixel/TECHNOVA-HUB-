<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz Firebase - TechNova Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#050816;
color:white;
padding:20px;
min-height:100vh;
}

body::before{
content:"";
position:fixed;
width:400px;
height:400px;
background:#ff9800;
filter:blur(150px);
top:-180px;
left:-150px;
opacity:.20;
z-index:-1;
}

body::after{
content:"";
position:fixed;
width:400px;
height:400px;
background:#ffca28;
filter:blur(150px);
bottom:-180px;
right:-150px;
opacity:.15;
z-index:-1;
}

.container{
max-width:900px;
margin:40px auto;
}

.quiz{
background:rgba(255,255,255,.06);
padding:35px;
border-radius:25px;
border:1px solid rgba(255,255,255,.10);
box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.logo{
text-align:center;
font-size:25px;
font-weight:800;
margin-bottom:25px;
}

.logo span{
color:#ffca28;
}

.badge{
display:block;
width:max-content;
margin:0 auto 20px;
padding:8px 18px;
border-radius:50px;
background:rgba(255,202,40,.12);
color:#ffca28;
font-size:14px;
font-weight:600;
}

h1{
text-align:center;
margin-bottom:15px;
}

.description{
text-align:center;
color:#cbd5e1;
margin-bottom:35px;
}

#questionNumber{
color:#94a3b8;
font-size:15px;
margin-bottom:15px;
}

.question{
font-size:23px;
font-weight:700;
line-height:1.5;
margin-bottom:25px;
}

.option{
background:rgba(255,255,255,.07);
border:1px solid rgba(255,255,255,.08);
padding:17px;
border-radius:14px;
margin:12px 0;
cursor:pointer;
transition:.25s;
}

.option:hover{
border-color:#ffca28;
transform:translateX(3px);
}

.option.selected{
background:#ffca28;
color:#111;
border-color:#ffca28;
font-weight:600;
}

.btn{
display:inline-block;
padding:14px 25px;
border:none;
border-radius:13px;
background:linear-gradient(90deg,#ff9800,#ffca28);
color:#111;
font-weight:700;
font-size:16px;
cursor:pointer;
text-decoration:none;
margin-top:20px;
}

.btn:hover{
transform:translateY(-2px);
}

.next-container{
text-align:right;
}

.result{
display:none;
text-align:center;
padding:20px;
}

.result h2{
font-size:35px;
margin:15px 0;
}

.success{
color:#22c55e;
}

.fail{
color:#ef4444;
}

.result p{
color:#cbd5e1;
line-height:1.7;
}

.score-circle{
font-size:50px;
font-weight:800;
margin:20px 0;
}

.back{
display:inline-block;
margin-bottom:20px;
padding:10px 18px;
border-radius:12px;
background:rgba(255,255,255,.07);
color:white;
text-decoration:none;
}

@media(max-width:600px){

body{
padding:12px;
}

.container{
margin:20px auto;
}

.quiz{
padding:22px;
}

.question{
font-size:19px;
}

.option{
padding:14px;
}

}

</style>

</head>

<body>

<div class="container">

<a href="formations.html" class="back">
⬅ Retour aux formations
</a>

<div class="quiz" id="quizBox">

<div class="logo">
🔥 <span>TechNova Hub</span>
</div>

<div class="badge">
🔥 FORMATION FIREBASE
</div>

<h1>Quiz Firebase</h1>

<p class="description">
Testez vos connaissances sur les bases de Firebase.
</p>

<div id="quizContent">

<div id="questionNumber">
Question 1 / 10
</div>

<div id="question" class="question"></div>

<div id="answers"></div>

<div class="next-container">

<button class="btn" onclick="nextQuestion()">
Suivant ➜
</button>

</div>

</div>

<div class="result" id="result">

<h2 id="resultTitle"></h2>

<div class="score-circle" id="score"></div>

<p id="resultMessage"></p>

<div id="resultButtons"></div>

</div>

</div>

</div>


<script>

const quiz = [

{
question:"Firebase est principalement...",
answers:[
"Une plateforme Backend-as-a-Service",
"Un système d'exploitation",
"Un navigateur web",
"Un langage de programmation"
],
correct:0
},

{
question:"Qui développe Firebase ?",
answers:[
"Microsoft",
"Google",
"Apple",
"Meta"
],
correct:1
},

{
question:"Quel service Firebase permet de gérer les inscriptions et connexions ?",
answers:[
"Firebase Hosting",
"Cloud Storage",
"Firebase Authentication",
"Cloud Functions"
],
correct:2
},

{
question:"Firestore est...",
answers:[
"Une base de données NoSQL",
"Un langage de programmation",
"Un système d'exploitation",
"Un éditeur de code"
],
correct:0
},

{
question:"Dans Firestore, les données sont principalement organisées en...",
answers:[
"Dossiers et fichiers",
"Collections et documents",
"Pages et sections",
"Serveurs et ports"
],
correct:1
},

{
question:"Quel service permet de stocker des images et des fichiers ?",
answers:[
"Firebase Storage",
"Firebase Authentication",
"Firebase Hosting",
"Firestore"
],
correct:0
},

{
question:"Quel service permet d'héberger un site web ?",
answers:[
"Firebase Hosting",
"Firebase Storage",
"Firestore",
"Authentication"
],
correct:0
},

{
question:"Quelle fonction permet de lire un document Firestore une fois ?",
answers:[
"getDoc()",
"deleteDoc()",
"updateDoc()",
"addDoc()"
],
correct:0
},

{
question:"Les règles Firebase servent principalement à...",
answers:[
"Décorer une page web",
"Contrôler les accès aux données",
"Créer des images",
"Modifier le navigateur"
],
correct:1
},

{
question:"Quel pourcentage minimum faut-il obtenir pour réussir ce quiz ?",
answers:[
"40 %",
"50 %",
"60 %",
"70 %"
],
correct:3
}

];

let currentQuestion = 0;
let score = 0;
let selected = null;


function loadQuestion(){

const current = quiz[currentQuestion];

document.getElementById("questionNumber").textContent =
"Question " + (currentQuestion + 1) + " / " + quiz.length;

document.getElementById("question").textContent =
current.question;

const answersContainer =
document.getElementById("answers");

answersContainer.innerHTML = "";

current.answers.forEach((answer,index)=>{

const option = document.createElement("div");

option.className = "option";

option.textContent = answer;

option.onclick = function(){

selectAnswer(index,option);

};

answersContainer.appendChild(option);

});

selected = null;

}


function selectAnswer(index,element){

selected = index;

const options =
document.querySelectorAll(".option");

options.forEach(option=>{

option.classList.remove("selected");

});

element.classList.add("selected");

}


function nextQuestion(){

if(selected === null){

alert("⚠️ Veuillez sélectionner une réponse.");

return;

}

if(selected === quiz[currentQuestion].correct){

score++;

}

currentQuestion++;

if(currentQuestion < quiz.length){

loadQuestion();

}else{

showResult();

}

}


function showResult(){

document.getElementById("quizContent").style.display = "none";

const result =
document.getElementById("result");

result.style.display = "block";

const percentage =
Math.round((score / quiz.length) * 100);

document.getElementById("score").textContent =
score + " / " + quiz.length + " — " + percentage + "%";

const title =
document.getElementById("resultTitle");

const message =
document.getElementById("resultMessage");

const buttons =
document.getElementById("resultButtons");


if(percentage >= 70){

title.textContent = "🎉 Félicitations !";

title.className = "success";

message.textContent =
"Vous avez réussi le quiz Firebase. Votre formation est validée.";

buttons.innerHTML = `

<a href="certificat.html" class="btn">
🏆 Obtenir mon certificat
</a>

<br>

<button class="btn" onclick="restartQuiz()">
🔄 Refaire le quiz
</button>

`;

}else{

title.textContent = "❌ Quiz non réussi";

title.className = "fail";

message.textContent =
"Il faut obtenir au moins 70 % pour valider cette formation. Relisez le cours puis réessayez.";

buttons.innerHTML = `

<button class="btn" onclick="restartQuiz()">
🔄 Recommencer
</button>

`;

}

}


function restartQuiz(){

currentQuestion = 0;

score = 0;

selected = null;

document.getElementById("quizContent").style.display =
"block";

document.getElementById("result").style.display =
"none";

loadQuestion();

}


loadQuestion();

</script>

</body>

</html>
